modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# IGNORE_ALL_VERSION: client-only mod, never flag a version mismatch when connecting to a server.
displayTest="IGNORE_ALL_VERSION"
logoFile="hotbaaaar.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="hotbaaaar.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
