# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

minecraft_version=1.21.11
# Fabric loader version - https://fabricmc.net/develop/
loader_version=0.19.3

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=hotbaaaar
# The human-readable display name for the mod.
mod_name=HotBaaaar
# The license of the mod.
mod_license=GNU GPL 3.0
# The mod version. Suffixed -fabric so the jar does not collide with the Forge jar of the same MC version.
mod_version=1.21.11-fabric-1.0
# The group ID for the mod.
mod_group_id=cn.ussshenzhou
# The authors of the mod.
mod_authors=USS_Shenzhou
# The description of the mod.
mod_description=Super long hotbar, client-side only. Scroll past the edge to flip the active row into the real hotbar.
