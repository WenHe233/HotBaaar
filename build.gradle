plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

loom {
    // Generate the mixin refmap under the name our mixins.json references (keeps it identical to the
    // Forge/NeoForge branches), instead of Loom's default "<archivesBaseName>-refmap.json".
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Use Mojang's official mappings so the shared client/mixin code compiles unchanged across loaders.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

tasks.register('verifyClientState', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.ussshenzhou.hotbaaaar.client.ClientStateTestSuite'
}

tasks.named('check').configure {
    dependsOn verifyClientState
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
